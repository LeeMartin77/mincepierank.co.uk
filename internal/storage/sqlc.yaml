version: "2"
sql:
  - engine: "postgresql"
    queries: "sqlc/queries"
    schema: "sqlc/schema"
    gen:
      go:
        package: "sqlcgen"
        sql_package: "pgx/v5"
        out: "sqlcgen"
        emit_interface: true
        # The only jsonb in the schema is maker_pie_yearly_categories.categories
        # (a jsonb_agg of {"id","slug","label"} objects), which the storage
        # layer scans into types.Categories. Map it here so queries that
        # select the column scan straight into the Go type, the same way pgx
        # scans jsonb into types.Categories today.
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "github.com/leemartin77/mincepierank.co.uk/internal/storage/types"
              type: "Categories"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "github.com/leemartin77/mincepierank.co.uk/internal/storage/types"
              type: "Categories"
