version: "2"
sql:
  - engine: "postgresql"
    queries: "sqlc/queries"
    schema: "sqlc/schema"
    gen:
      go:
        package: "sqlcgen"
        sql_package: "pgx/v5"
        out: "sqlcgen"
        emit_interface: true
        overrides:
          - column: "maker_pie_yearly_categories.categories"
            go_type:
              import: "github.com/leemartin77/mincepierank.co.uk/internal/storage/types"
              type: "Categories"
