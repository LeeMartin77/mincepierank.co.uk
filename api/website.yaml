      name: brand
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        default: 1
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      required: false
      schema:
        default: 20
        type: integer
        format: int64
    CategoriesFilter:
      name: categories
      description: Categories to filter pies on
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
  responses:
    NotFound:
      description: not found
      content:
        text/html:
          schema:
            type: string
    UnexpectedError:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
