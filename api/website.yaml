openapi: "3.0.0"
info:
  version: 1.0.0
  title: MincePieRank
servers:
  - url: https://mincepierank.co.uk/
paths:
  /:
    get:
      summary: Home Page
      operationId: homePage
      tags:
        - public
      responses:
        "200":
          description: home page
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/UnexpectedError"
  /about:
    get:
      operationId: aboutPage
      tags:
        - public
      responses:
        "200":
          description: home page
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/UnexpectedError"
  /about/cookies:
    get:
      operationId: cookiePage
      tags:
        - public
      responses:
        "200":
          description: cookie page
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/UnexpectedError"
  /about/privacy:
    get:
      operationId: privacyPage
      tags:
        - public
      responses:
        "200":
          description: privacy page
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years:
    get:
      operationId: yearsPage
      tags:
        - public
      responses:
        "200":
          description: years page
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}:
    parameters:
      - $ref: "#/components/parameters/Year"
    get:
      operationId: yearPage
      tags:
        - public
      responses:
        "200":
          description: year page
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/all-pies:
    parameters:
      - $ref: "#/components/parameters/Year"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/CategoriesFilter"
    get:
      operationId: yearAllPies
      tags:
        - public
      responses:
        "200":
          description: year all pies
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/categories:
    parameters:
      - $ref: "#/components/parameters/Year"
    get:
      operationId: yearAllCategories
      tags:
        - public
      responses:
        "200":
          description: year all categories
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/categories/{category}:
    parameters:
      - $ref: "#/components/parameters/Year"
      - name: category
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/CategoriesFilter"
    get:
      operationId: yearCategoryPies
      tags:
        - public
      responses:
        "200":
          description: year all categories
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/brands:
    parameters:
      - $ref: "#/components/parameters/Year"
    get:
      operationId: yearAllBrands
      tags:
        - public
      responses:
        "200":
          description: year all brands
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/brands/{brand}:
    parameters:
      - $ref: "#/components/parameters/Year"
      - $ref: "#/components/parameters/Brand"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/CategoriesFilter"
    get:
      operationId: yearBrandPies
      tags:
        - public
      responses:
        "200":
          description: year all brands
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/brands/{brand}/{pie}:
    parameters:
      - $ref: "#/components/parameters/Year"
      - $ref: "#/components/parameters/Brand"
      - name: pie
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: yearBrandPie
      tags:
        - public
      responses:
        "200":
          description: single pie
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/brands/{brand}/{pie}/rating:
    parameters:
      - $ref: "#/components/parameters/Year"
      - $ref: "#/components/parameters/Brand"
      - name: pie
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: rateYearBrandPie
      requestBody:
        description: Update Body
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - value
                - looks
                - topping
                - filling
                - pastry
              properties:
                value:
                  type: integer
                looks:
                  type: integer
                topping:
                  type: integer
                filling:
                  type: integer
                pastry:
                  type: integer
      tags:
        - public
      responses:
        "200":
          description: Successfully updated rating
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Something was wrong with the request
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /profile/rankings/{year}:
    parameters:
      - $ref: "#/components/parameters/Year"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/CategoriesFilter"
    get:
      operationId: yearPersonalRanking
      tags:
        - personal
      responses:
        "200":
          description: User's individual rankings
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  # ── User Submittable Pies (Phase 1: submission routes) ──
  /years/{year}/submit:
    parameters:
      - $ref: "#/components/parameters/Year"
    get:
      operationId: submitPieForm
      tags:
        - public
      responses:
        "200":
          description: Submit pie form
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Redirect to sign-in if not signed in
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: submitPie
      tags:
        - public
      requestBody:
        description: Submit Body
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - displayname
                - maker
                - location
                - fresh
                - labels
                - imageFile
                - webLink
                - packCount
                - packPrice
              properties:
                displayname:
                  type: string
                maker:
                  type: string
                location:
                  type: string
                fresh:
                  type: boolean
                labels:
                  type: string
                imageFile:
                  type: string
                  format: binary
                webLink:
                  type: string
                packCount:
                  type: number
                  x-go-type: int32
                packPrice:
                  type: number
                  x-go-type: int32
      responses:
        "303":
          description: Success — redirect to user pie page
        "400":
          description: Validation error
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to sign-in if not signed in
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/user-pies:
    parameters:
      - $ref: "#/components/parameters/Year"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Limit"
    get:
      operationId: listUserPies
      tags:
        - public
      responses:
        "200":
          description: Community Pies list
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/user-pies/{id}:
    parameters:
      - $ref: "#/components/parameters/Year"
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUserPie
      tags:
        - public
      responses:
        "200":
          description: User pie page
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /years/{year}/user-pies/{id}/rating:
    parameters:
      - $ref: "#/components/parameters/Year"
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: rateUserPie
      requestBody:
        description: Update Body
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - pastry
                - filling
                - topping
                - looks
                - value
              properties:
                pastry:
                  type: integer
                filling:
                  type: integer
                topping:
                  type: integer
                looks:
                  type: integer
                value:
                  type: integer
      tags:
        - public
      responses:
        "200":
          description: Successfully updated rating
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Something was wrong with the request
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /profile/pies/{year}:
    parameters:
      - $ref: "#/components/parameters/Year"
    get:
      operationId: myUserPies
      tags:
        - personal
      responses:
        "200":
          description: My Pies page
