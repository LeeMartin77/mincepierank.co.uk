        in: path
        required: true
        schema:
          type: string
    get:
      operationId: editUserPieForm
      tags:
        - personal
      responses:
        "200":
          description: Edit pie form
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "302":
          description: Redirect to sign-in if not signed in
        default:
          $ref: "#/components/responses/UnexpectedError"
    put:
      operationId: editUserPie
      tags:
        - personal
      requestBody:
        description: Edit Body
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - displayname
                - maker
                - location
                - fresh
                - labels
                - imageFile
                - webLink
                - packCount
                - packPrice
              properties:
                displayname:
                  type: string
                maker:
                  type: string
                location:
                  type: string
                fresh:
                  type: boolean
                labels:
                  type: string
                imageFile:
                  type: string
                  format: binary
                webLink:
                  type: string
                packCount:
                  type: number
                  x-go-type: int32
                packPrice:
                  type: number
                  x-go-type: int32
      responses:
        "303":
          description: Success — redirect to user pie page
        "400":
          description: Validation error
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: withdrawUserPie
      tags:
        - personal
      responses:
        "303":
          description: Success — redirect to My Pies
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /admin:
