name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "^1.25" # net/http.CrossOriginProtection needs 1.25; go.mod requires 1.27

      - name: Test
        run: go test -v ./...
